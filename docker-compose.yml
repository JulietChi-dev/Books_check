services:
  postgres:
    image: postgres:16-alpine
    container_name: bookscheck-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookscheck_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookscheck_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
